<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Toque e Fale: aplicativo gratuito de comunicacao alternativa para estudantes nao verbais.">
<title>Toque e Fale</title>
<link rel="icon" type="image/webp" href="assets/img/papagaio-rosto.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="splash" role="img" aria-label="Toque e Fale"><div class="sp-bird" style="background-image:url(assets/img/splash/papagaio-sprite.webp)"></div><img class="sp-logo" alt="Toque e Fale" src="assets/img/logo.png"></div>
<script src="assets/js/splash.js"></script>
<header>
  <div class="hl">
    <button id="back" class="back-btn" type="button" hidden aria-label="Voltar para as categorias"><svg viewBox="0 0 32 32"><path d="M7 7L25 25M25 7L7 25"/></svg></button>
    <img id="logo" alt="Papagaio, mascote do Toque e Fale" src="assets/img/papagaio-rosto.webp">
  </div>
  <div class="brand" id="title"></div>
  <div class="hr">
    <div class="who" id="who"></div>
    <button id="theme" class="theme-btn" type="button"><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="currentColor"/></svg></button>
    <button id="menu" class="menu-btn" type="button" aria-label="Abrir o painel do professor" title="Painel do professor"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="12" cy="19" r="2.4"/></svg></button>
  </div>
</header>
<main id="home" aria-label="Cartões de comunicação"></main>
<button id="gear" type="button" aria-label="Segure para abrir o painel do professor">⚙</button>
<div id="slot"></div>
<script src="assets/js/app.js"></script>
</body>
</html>
